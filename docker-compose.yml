# TriageIQ local stack:  docker compose up --build
#   front end  http://localhost:3000
#   API docs   http://localhost:8000/docs
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://triage:triage@db:5432/triage
    ports: ["8000:8000"]
    volumes:
      - ./data:/data
      # Knowledge Base edits are saved to the repo folder, so they survive rebuilds and can be committed
      - ./backend/app/rag/policies:/app/app/rag/policies
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
